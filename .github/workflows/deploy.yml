name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master # Укажите master, если ваша основная ветка называется так

# Разрешаем workflow менять содержимое GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Шаг сборки. Если у вас есть секретный токен, передаем его здесь
      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload production artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Папка сборки: 'dist' для Vite, 'build' для Create React App
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
